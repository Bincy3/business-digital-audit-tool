<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Audit | {{ audit.business_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.4/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="fa-solid fa-gauge-high me-2"></i>Digital Audit Pro
      </a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="dashboard-card p-4 p-lg-5">
      <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
          <span class="eyebrow">Edit Saved Audit</span>
          <h1 class="display-6 fw-bold mt-2">{{ audit.business_name }}</h1>
          <p class="text-muted mb-0">Update the saved audit details and follow-up message.</p>
        </div>
        <a href="/history" class="btn btn-outline-secondary">Back to History</a>
      </div>

      <form method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Business Name</label>
            <input class="form-control" name="business_name" value="{{ audit.business_name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Industry</label>
            <input class="form-control" name="industry" value="{{ audit.industry or '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Website URL</label>
            <input class="form-control" name="website_url" value="{{ audit.website_url }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Status</label>
            <input class="form-control" name="status" value="{{ audit.status or 'Complete' }}">
          </div>
          <div class="col-12">
            <label class="form-label">Recommendations</label>
            <textarea class="form-control" name="recommendations" rows="5">{{ '\n'.join(audit.recommendations) if audit.recommendations else '' }}</textarea>
            <div class="form-text">Put each recommendation on its own line.</div>
          </div>
          <div class="col-12">
            <label class="form-label">WhatsApp Message</label>
            <textarea class="form-control" name="whatsapp_message" rows="4">{{ audit.whatsapp_message or '' }}</textarea>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="/history" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
